name: Validate

on:
  push:
  pull_request:

jobs:
  syntax-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q experiment.py benchmark scripts lanedg_experiment
      - name: Verify annotation transforms, metrics, leakage controls, and model gradients
        run: python -m pytest tests -q -p no:cacheprovider
