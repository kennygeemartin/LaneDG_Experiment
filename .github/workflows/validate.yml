name: Validate

on:
  push:
  pull_request:

jobs:
  syntax-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q experiment.py lanedg_experiment
      - name: Validate model parameter count and output
        run: |
          python - <<'PY'
          import torch
          from lanedg_experiment.models import LaneDG
          model = LaneDG().eval()
          assert sum(p.numel() for p in model.parameters()) == 405_088
          with torch.no_grad():
              assert model(torch.randn(1, 3, 64, 64)).shape == (1, 1, 64, 64)
          PY

