# Descriptive defaults for the real-image semantic rerun.
# The executed authoritative configuration is runs/real_v1/protocol.json.
# This YAML is documentation; the runner uses its explicit CLI arguments.
model: LaneDG-Semantic-Reimplementation-v1
architecture_status: documented_semantic_adaptation_not_verified_original_instance_model
parameters: 1141793
sampling:
  seed: 42
  train: 80
  validation: 20
  evaluation: 40
  policy: one_random_frame_per_sampled_sequence_group
  bdd100k_evaluation_partition: labeled_val_disjoint_from_validation
training:
  seeds: [42, 43, 44]
  epochs: 8
  size: 256
  batch: 4
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.0005
  warmup_epochs: 3
  scheduler: cosine_with_0.01_floor
  initialization: random
  loss: masked_BCE_plus_Dice_plus_0.5_bidirectional_continuity
selection:
  checkpoint: minimum_source_validation_loss
  threshold: maximum_source_validation_pixel_F1
  target_data_used: false
evaluation:
  frozen_matrix: 3_by_3_per_seed
  metrics: [pixel_precision, pixel_recall, pixel_f1, mean_image_iou]
  descriptive_success_rates: [mask_iou_success_50, mask_iou_success_50_95]
  bootstrap: sequence_cluster_percentile
  bootstrap_repetitions: 2000
  bootstrap_seed: 20261022
  confidence_level: 0.95
